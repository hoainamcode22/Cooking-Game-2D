<!DOCTYPE html>
<html lang="vi">
<head>

<title>Hồ Sơ Người Chơi — phương án A (2 cột: avatar trái, thông tin phải)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

<body>

</div>
<img src="assets/btnX.png" style="position:absolute;top:-26px;right:-26px;width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 5px 7px rgba(0,0,0,.4));z-index:3;">
<div style="position:absolute;top:74px;left:36px;right:36px;bottom:32px;background:linear-gradient(180deg,#fdf3da,#fbeccb);border:4px solid #6e4014;border-radius:22px;box-shadow:inset 0 0 0 3px #f3ddb0;padding:22px;display:flex;gap:22px;">
<div style="width:320px;flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;">
<div style="position:relative;">
<div style="width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#faf0d6,#f1dfb4 78%);border:6px solid #d99a4e;box-shadow:inset 0 4px 10px rgba(150,95,30,.25),0 6px 0 rgba(190,140,70,.4);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;">
<img src="assets/avata_player.png" style="width:180px;height:180px;object-fit:cover;">
</div>
<div style="position:absolute;bottom:2px;left:6px;width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#ffd257,#f0a32f);border:4px solid #a35c14;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.25);">

</div>

<div style="aspect-ratio:1;border-radius:50%;background:#fffdf4;border:3px solid #4c8f1d;box-shadow:0 0 0 3px rgba(108,191,46,.3);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;"><img src="assets/avata_player.png" style="width:82%;height:82%;object-fit:cover;"></div>

<div style="aspect-ratio:1;border-radius:50%;background:#fffdf4;border:3px solid #ecd09c;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;"><img src="assets/avata_player.png" style="width:82%;height:82%;object-fit:cover;filter:hue-rotate(160deg) saturate(1.1);"></div>

<div style="aspect-ratio:1;border-radius:50%;background:rgba(50,32,12,.15);border:3px solid #c9b188;display:flex;align-items:center;justify-content:center;"><div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><div style="width:12px;height:9px;border:3px solid #a88d62;border-bottom:none;border-radius:7px 7px 0 0;"></div><div style="width:20px;height:13px;background:#a88d62;border-radius:3px;"></div></div></div>
</div>
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:14px;">
<div style="display:flex;flex-direction:column;gap:6px;">
<span style="font-size:16px;font-weight:800;color:#8a6337;">Tên nông trại</span>
<div style="display:flex;align-items:center;gap:10px;background:#f3e2bb;border:3px solid #d9b478;border-radius:16px;padding:0 16px;height:58px;box-shadow:inset 0 3px 6px rgba(120,75,20,.25);">
<span style="font-size:24px;font-weight:800;color:#5b3417;flex:1;">Nông Dân Vui Vẻ</span>
<span style="font-size:22px;color:#a3803f;">✎</span>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#fffdf4,#fdf6e3);border:3px solid #ecd09c;border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 rgba(190,140,70,.3);">
<div style="display:flex;align-items:baseline;justify-content:space-between;">
<span style="font-size:21px;font-weight:800;color:#5b3417;">Cấp độ 7</span>

<div style="position:absolute;left:0;top:0;bottom:0;width:62%;background:linear-gradient(180deg,#a9e470,#68bd2b);border-radius:15px;"></div>
<div style="position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));border-radius:15px 15px 0 0;"></div>
<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(90,50,15,.55);">248 / 400 EXP</span>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
<div style="display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fffdf4,#fdf6e3);border:3px solid #ecd09c;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(190,140,70,.3);">
<img src="assets/shop/baothoc.png" style="width:52px;height:52px;object-fit:contain;">
<div style="display:flex;flex-direction:column;">
<span style="font-size:15px;font-weight:700;color:#a3803f;">Kho</span>
<span style="font-size:22px;font-weight:800;color:#5b3417;">Cấp 2</span>
</div>
</div>
<div style="display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fffdf4,#fdf6e3);border:3px solid #ecd09c;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(190,140,70,.3);">
<img src="assets/monan1.png" style="width:52px;height:52px;object-fit:contain;">
<div style="display:flex;flex-direction:column;">
<span style="font-size:15px;font-weight:700;color:#a3803f;">Điểm nấu ăn</span>
<span style="font-size:22px;font-weight:800;color:#5b3417;">128</span>
</div>
</div>
<div style="display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fffdf4,#fdf6e3);border:3px solid #ecd09c;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(190,140,70,.3);">

</div>
<div style="display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fffdf4,#fdf6e3);border:3px solid #ecd09c;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(190,140,70,.3);">
<img src="assets/iconsao.png" style="width:46px;height:46px;object-fit:contain;">
<div style="display:flex;flex-direction:column;">
<span style="font-size:15px;font-weight:700;color:#a3803f;">Thành tựu</span>

</div>
</div>
</div>
<div style="margin-top:auto;height:54px;border-radius:16px;background:linear-gradient(180deg,#a5e05e,#57a51f);border:3px solid #3f8a12;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35);">
<span style="font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);">LƯU HỒ SƠ</span>

</div>
</div>
</div>
